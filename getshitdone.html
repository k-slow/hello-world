<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <title>Get Shit Done</title>
  <link href="styles.css" rel="stylesheet" type="text/css">
</head>
<body>
  <div class="gsd-container">
    <h1 class="gsd-title">Get Shit Done</h1>
    <p class="gsd-subtitle">No distractions. Just tasks. Crush them.</p>

    <div class="gsd-input-row">
      <input type="text" id="taskInput" class="gsd-input" placeholder="What needs to get done?" />
      <button id="addBtn" class="gsd-btn">Add</button>
    </div>

    <ul id="taskList" class="gsd-list"></ul>

    <div class="gsd-stats">
      <span id="stats">0 done / 0 total</span>
    </div>

    <a href="index.html" class="gsd-back">&larr; Back</a>
  </div>

  <script>
    var tasks = JSON.parse(localStorage.getItem('gsd-tasks') || '[]');

    function save() {
      localStorage.setItem('gsd-tasks', JSON.stringify(tasks));
    }

    function render() {
      var list = document.getElementById('taskList');
      list.innerHTML = '';
      var done = 0;
      tasks.forEach(function(task, i) {
        if (task.done) done++;
        var li = document.createElement('li');
        li.className = 'gsd-item' + (task.done ? ' gsd-done' : '');
        li.innerHTML =
          '<span class="gsd-check" data-i="' + i + '">' + (task.done ? '&#10003;' : '&#9675;') + '</span>' +
          '<span class="gsd-text">' + task.text + '</span>' +
          '<span class="gsd-delete" data-i="' + i + '">&times;</span>';
        list.appendChild(li);
      });
      document.getElementById('stats').textContent = done + ' done / ' + tasks.length + ' total';
    }

    function addTask() {
      var input = document.getElementById('taskInput');
      var text = input.value.trim();
      if (!text) return;
      tasks.push({ text: text, done: false });
      input.value = '';
      save();
      render();
    }

    document.getElementById('addBtn').addEventListener('click', addTask);
    document.getElementById('taskInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addTask();
    });

    document.getElementById('taskList').addEventListener('click', function(e) {
      var target = e.target;
      var i = parseInt(target.getAttribute('data-i'));
      if (isNaN(i)) return;
      if (target.classList.contains('gsd-check')) {
        tasks[i].done = !tasks[i].done;
        save();
        render();
      } else if (target.classList.contains('gsd-delete')) {
        tasks.splice(i, 1);
        save();
        render();
      }
    });

    render();
  </script>
</body>
</html>
